name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t jesslyncaroline/uts-devops-backend:latest ./backend

      - name: Push backend Docker image
        run: docker push jesslyncaroline/uts-devops-backend:latest

      - name: Build frontend Docker image
        run: docker build -t jesslyncaroline/uts-devops-frontend:latest ./frontend

      - name: Push frontend Docker image
        run: docker push jesslyncaroline/uts-devops-frontend:latest

  deploy-local:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        shell: powershell
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          @"
          DB_HOST=db
          DB_USER=root
          DB_NAME=crud_db
          DB_PASSWORD=$env:DB_PASSWORD
          VITE_API_URL=http://localhost:8001
          "@ | Set-Content -Path .env -Encoding ascii

      - name: Deploy with Docker Compose
        shell: powershell
        run: |
          docker compose down
          docker compose up -d --build


name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build backend Docker image
        run: docker build -t jesslyncaroline/uts-devops-backend:1.0.0 ./backend

      - name: Push backend Docker image
        run: docker push jesslyncaroline/uts-devops-backend:1.0.0


      - name: Build frontend Docker image
        run: docker build -t jesslyncaroline/uts-devops-frontend:1.0.0 ./frontend

      - name: Push frontend Docker image
        run: docker push jesslyncaroline/uts-devops-frontend:1.0.0


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
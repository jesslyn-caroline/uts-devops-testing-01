name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t jesslyncaroline/uts-devops-backend:latest ./backend

      - name: Push backend Docker image
        run: docker push jesslyncaroline/uts-devops-backend:latest

      - name: Build frontend Docker image
        run: docker build -t jesslyncaroline/uts-devops-frontend:latest ./frontend

      - name: Push frontend Docker image
        run: docker push jesslyncaroline/uts-devops-frontend:latest

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /path/to/your/app
            git pull origin main
            docker compose pull
            docker compose up -d --build
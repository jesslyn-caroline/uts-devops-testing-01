services:
  frontend:
    image: jesslyncaroline/uts-devops-frontend:latest
    container_name: uts-devops-frontend
    restart: always
    ports:
      - '8000:80'
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: jesslyncaroline/uts-devops-backend:latest
    container_name: uts-devops-backend
    restart: always
    ports:
      - '8001:3000'
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8
    container_name: uts-devops-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge